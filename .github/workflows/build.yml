name: Build, Test and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true
      
      - name: Install dependencies
        run: go mod download

      - name: Run tests
        run: go test -v ./...

      - name: Build
        run: go build -v ./...

  release-please:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.TOKEN }}
          
  release-binaries:
    needs: release-please
    runs-on: ubuntu-latest
    if: ${{ needs.release-please.outputs.release_created }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.4'
          cache: true

      - name: Build Release Binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-X 'github.com/dirtydriver/templateer-cli/version.Version=${{ needs.release-please.outputs.tag_name }}'" -o templateer-linux-amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-X 'github.com/dirtydriver/templateer-cli/version.Version=${{ needs.release-please.outputs.tag_name }}'" -o templateer-windows-amd64.exe
          GOOS=darwin GOARCH=amd64 go build -ldflags="-X 'github.com/dirtydriver/templateer-cli/version.Version=${{ needs.release-please.outputs.tag_name }}'" -o templateer-darwin-amd64

      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} templateer-linux-amd64
          gh release upload ${{ needs.release-please.outputs.tag_name }} templateer-windows-amd64.exe
          gh release upload ${{ needs.release-please.outputs.tag_name }} templateer-darwin-amd64
